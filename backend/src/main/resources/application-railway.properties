# Accept an external PostgreSQL JDBC URL (Neon), or Railway PG* references.
server.address=0.0.0.0
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${PGHOST:}:${PGPORT:5432}/${PGDATABASE:}}
spring.datasource.username=${DATABASE_USER:${PGUSER:}}
spring.datasource.password=${DATABASE_PASSWORD:${PGPASSWORD:}}
