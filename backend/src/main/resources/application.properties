server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/toyfactory;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
toy.machine-id=${TOY_MACHINE_ID:TF-001}
toy.machine-key=${TOY_MACHINE_KEY:}
toy.access-token=${MP_ACCESS_TOKEN:}
toy.webhook-secret=${MP_WEBHOOK_SECRET:}
toy.webhook-url=${MP_WEBHOOK_URL:}
toy.live-mode=${MP_LIVE_MODE:false}
# Three fixed packages, ids matched by the kiosk frontend. Override per-field only if the catalog changes.
toy.packages[0].id=${TOY_PACKAGE_1_ID:pkg-2-5}
toy.packages[0].credits=${TOY_PACKAGE_1_CREDITS:2}
toy.packages[0].amount=${TOY_PACKAGE_1_AMOUNT:5.00}
toy.packages[1].id=${TOY_PACKAGE_2_ID:pkg-4-10}
toy.packages[1].credits=${TOY_PACKAGE_2_CREDITS:4}
toy.packages[1].amount=${TOY_PACKAGE_2_AMOUNT:10.00}
toy.packages[2].id=${TOY_PACKAGE_3_ID:pkg-6-15}
toy.packages[2].credits=${TOY_PACKAGE_3_CREDITS:6}
toy.packages[2].amount=${TOY_PACKAGE_3_AMOUNT:15.00}
toy.session-seconds=${TOY_SESSION_SECONDS:180}

# Supply only a payer identity explicitly supported by your Mercado Pago totem integration.
toy.pix-payer-email=${MP_PIX_PAYER_EMAIL:}

# Gate for the hidden admin panel (F8x3 shortcut in the kiosk). Empty disables it entirely.
toy.admin-pin=${ADMIN_PIN:}
